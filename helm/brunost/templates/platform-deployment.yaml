apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "brunost.fullname" . }}-platform
  labels:
    {{- include "brunost.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform
spec:
  replicas: {{ .Values.platform.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: platform
      {{- include "brunost.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: platform
        {{- include "brunost.labels" . | nindent 8 }}
    spec:
      containers:
        - name: platform
          image: {{ .Values.platform.image | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.platform.port }}
          env:
            - name: BRUNOST_JUDGE_URL
              value: http://{{ include "brunost.fullname" . }}-judge:{{ .Values.judge.port }}
            - name: BRUNOST_JUDGE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "brunost.fullname" . }}-judge
                  key: api-token
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
