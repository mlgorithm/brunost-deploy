{{- range .Values.workers }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "brunost.fullname" $ }}-worker-{{ .name }}
  labels:
    {{- include "brunost.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker
    brunost.io/worker-class: {{ .name | quote }}
spec:
  replicas: {{ .replicas }}
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
      brunost.io/worker-class: {{ .name | quote }}
      {{- include "brunost.labels" $ | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
        brunost.io/worker-class: {{ .name | quote }}
        {{- include "brunost.labels" $ | nindent 8 }}
      annotations:
        prometheus.io/scrape: {{ $.Values.monitoring.enabled | quote }}
        prometheus.io/path: {{ $.Values.monitoring.path | quote }}
        prometheus.io/port: {{ $.Values.monitoring.port | quote }}
    spec:
      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $.Values.workerDefaults.terminationGraceSeconds }}
      containers:
        - name: worker
          image: {{ .image | quote }}
          resources:
            {{- toYaml .resources | nindent 12 }}
          command: ["worker", "--config", "/etc/brunost/node.json", "--poll-seconds", "1"]
          env:
            - name: BRUNOST_JUDGE_ENV
              value: production
            - name: BRUNOST_JUDGE_REQUIRE_IMMUTABLE_ARTIFACTS
              value: "true"
            - name: BRUNOST_JUDGE_CALLBACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "brunost.fullname" $ }}-judge
                  key: callback-secret
            - name: BRUNOST_JUDGE_REQUIRE_SIGNED_CALLBACKS
              value: "true"
            - name: BRUNOST_JUDGE_SANDBOX_MODE
              value: "docker"
            - name: BRUNOST_JUDGE_SANDBOX_IMAGE
              value: {{ $.Values.workerDefaults.sandbox.image | quote }}
            - name: BRUNOST_JUDGE_SANDBOX_IMAGES
              value: {{ $.Values.workerDefaults.sandbox.images | quote }}
            - name: BRUNOST_JUDGE_SANDBOX_RUNTIME
              value: {{ $.Values.workerDefaults.sandbox.runtime | quote }}
            - name: BRUNOST_JUDGE_REQUIRE_SECCOMP
              value: {{ $.Values.workerDefaults.sandbox.requireSeccomp | quote }}
            - name: BRUNOST_JUDGE_SANDBOX_SECCOMP
              value: {{ $.Values.workerDefaults.sandbox.seccompProfilePath | quote }}
            - name: BRUNOST_JUDGE_SANDBOX_TIMEOUT_SECONDS
              value: "900"
            - name: BRUNOST_JUDGE_SANDBOX_MEMORY
              value: "4g"
            - name: BRUNOST_JUDGE_SANDBOX_CPUS
              value: "2"
            - name: BRUNOST_JUDGE_SANDBOX_PIDS_LIMIT
              value: "256"
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2375
            - name: TMPDIR
              value: {{ $.Values.workerDefaults.workspacePath | quote }}
            - name: BRUNOST_WORKER_QUEUES
              value: {{ join "," .queues | quote }}
            - name: BRUNOST_WORKER_RESOURCE_CLASSES
              value: {{ join "," .resourceClasses | quote }}
            - name: BRUNOST_WORKER_REGION
              value: {{ .region | default "" | quote }}
            - name: BRUNOST_JUDGE_URL
              value: http://{{ include "brunost.fullname" $ }}-judge:{{ $.Values.judge.port }}
            - name: BRUNOST_JUDGE_ARTIFACT_BACKEND
              value: {{ $.Values.artifacts.backend | quote }}
            - name: BRUNOST_JUDGE_ARTIFACT_ENDPOINT
              value: {{ $.Values.artifacts.endpoint | quote }}
            - name: BRUNOST_JUDGE_ARTIFACT_BUCKET
              value: {{ $.Values.artifacts.bucket | quote }}
            - name: BRUNOST_JUDGE_ARTIFACT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "brunost.fullname" $ }}-judge
                  key: artifact-access-key
            - name: BRUNOST_JUDGE_ARTIFACT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "brunost.fullname" $ }}-judge
                  key: artifact-secret-key
          volumeMounts:
            - name: node-config
              mountPath: /etc/brunost
              readOnly: true
            - name: worker-workspaces
              mountPath: {{ $.Values.workerDefaults.workspacePath }}
            - name: worker-seccomp
              mountPath: {{ $.Values.workerDefaults.sandbox.seccompProfilePath }}
              readOnly: true
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "kill -TERM 1; sleep 10"]
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -s /etc/brunost/node.json && kill -0 1"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "kill -0 1"]
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
        - name: docker-socket-proxy
          image: {{ $.Values.workerDefaults.socketProxyImage | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: CONTAINERS
              value: "1"
            - name: IMAGES
              value: "1"
            - name: INFO
              value: "1"
            - name: VERSION
              value: "1"
            - name: POST
              value: "1"
            - name: NETWORKS
              value: "0"
            - name: VOLUMES
              value: "0"
            - name: EXEC
              value: "0"
            - name: AUTH
              value: "0"
            - name: SECRETS
              value: "0"
            - name: SWARM
              value: "0"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker.sock
      volumes:
        - name: node-config
          secret:
            secretName: {{ include "brunost.fullname" $ }}-node-{{ .name }}
        - name: docker-socket
          hostPath:
            path: {{ $.Values.workerDefaults.dockerSocketPath }}
            type: Socket
        - name: worker-workspaces
          hostPath:
            path: {{ $.Values.workerDefaults.workspacePath }}
            type: DirectoryOrCreate
        - name: worker-seccomp
          hostPath:
            path: {{ $.Values.workerDefaults.sandbox.seccompProfilePath }}
            type: File
{{- end }}
