apiVersion: v1
kind: Service
metadata:
  name: {{ include "brunost.fullname" . }}-judge
  labels:
    {{- include "brunost.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: judge
    {{- include "brunost.labels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.judge.port }}
      targetPort: http
