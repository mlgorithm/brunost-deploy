{{- if not .Values.postgres.externalUrl }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "brunost.fullname" . }}-postgres
type: Opaque
stringData:
  password: replace-me
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "brunost.fullname" . }}-postgres
spec:
  selector:
    app.kubernetes.io/component: postgres
    {{- include "brunost.labels" . | nindent 4 }}
  ports:
    - port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "brunost.fullname" . }}-postgres
  labels:
    {{- include "brunost.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "brunost.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
      {{- include "brunost.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres
        {{- include "brunost.labels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: brunost
            - name: POSTGRES_USER
              value: brunost
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "brunost.fullname" . }}-postgres
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
