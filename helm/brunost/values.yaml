nameOverride: ""
fullnameOverride: ""

platform:
  image: ghcr.io/mlgorithm/brunost-platform@sha256:<64-hex-digest>
  replicas: 3
  port: 3000

judge:
  image: ghcr.io/mlgorithm/brunost-judge@sha256:<64-hex-digest>
  replicas: 2
  port: 8787
  apiToken: replace-me
  callbackSigningSecret: replace-me

workers:
  - name: cpu
    image: ghcr.io/mlgorithm/brunost-judge@sha256:<64-hex-digest>
    replicas: 1
    queues: [default]
    resourceClasses: [cpu]
  - name: gpu
    image: ghcr.io/mlgorithm/brunost-judge@sha256:<64-hex-digest>
    replicas: 1
    queues: [gpu, default]
    resourceClasses: [gpu, cpu]

# Filled by `brunostctl node join` and passed to Helm with --set-file. Never
# commit worker tokens to a values file.
nodeConfigs: {}

postgres:
  externalUrl: ""
  image: postgres@sha256:<64-hex-digest>
  storage: 50Gi

artifacts:
  endpoint: ""
  bucket: brunost-artifacts
  backend: s3
  accessKey: ""
  secretKey: ""

ingress:
  enabled: true
  className: nginx
  host: contest.example.org
  tlsSecret: brunost-tls

monitoring:
  enabled: true
