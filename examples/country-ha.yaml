version: 1

cluster:
  name: country-2026
  public_url: https://contest.example.org

backend: k3s

judge:
  replicas: 2
  image: ghcr.io/mlgorithm/brunost-judge@sha256:<64-hex-digest>
  worker_image: ghcr.io/mlgorithm/brunost-judge@sha256:<64-hex-digest>
  callback_hosts: [premium.example.org]

workers:
  - name: cpu
    resource_classes: [cpu]
    queues: [default]
  - name: gpu
    resource_classes: [gpu, cpu]
    queues: [gpu, default]

storage:
  postgres: external
  postgres_url: ${BRUNOST_POSTGRES_URL}
  artifacts: external
  artifacts_endpoint: ${BRUNOST_ARTIFACT_ENDPOINT}
  artifacts_bucket: brunost-artifacts

security:
  tls: true

operations:
  worker_drain_timeout_seconds: 900
  worker_termination_grace_seconds: 900
