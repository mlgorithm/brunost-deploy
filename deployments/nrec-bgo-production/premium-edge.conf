upstream brunost_platform_core {
    server 127.0.0.1:3002 max_fails=2 fail_timeout=10s;
    server [2001:700:2:8300::2472]:3002 max_fails=2 fail_timeout=10s;
}
upstream brunost_premium {
    server 127.0.0.1:3100 max_fails=2 fail_timeout=10s;
    server 158.39.201.29:3100 max_fails=2 fail_timeout=10s;
}
upstream brunost_backend { server 158.37.65.146:8000 max_fails=2 fail_timeout=10s; }
upstream brunost_judge { server 158.37.65.202:8787 max_fails=2 fail_timeout=10s; }

limit_req_zone $binary_remote_addr zone=brunost_api:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=brunost_auth_sensitive:10m rate=10r/m;

map $http_x_forwarded_proto $brunost_forwarded_proto {
    default $scheme;
    https https;
    http http;
}

server {
    listen 80;
    listen [::]:80;
    server_name brunost.ioai.no;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name brunost.ioai.no;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/brunost.ioai.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brunost.ioai.no/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 250m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Premium owns CSP and cross-origin isolation. The edge owns transport and
    # generic hardening, and hides matching upstream headers to avoid duplicates.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Permissions-Policy;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $brunost_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    limit_req_status 429;

    location ~ /\.(?!well-known) { deny all; }
    location = /metrics { return 404; }

    location = /platform-core { return 301 /platform-core/; }
    location ^~ /platform-core/ {
        rewrite ^/platform-core/?(.*)$ /$1 break;
        proxy_pass http://brunost_platform_core;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    location = /premium { return 301 /premium/; }
    location ^~ /premium/ {
        rewrite ^/premium/?(.*)$ /$1 break;
        proxy_pass http://brunost_premium;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    location ^~ /judge/ {
        rewrite ^/judge/?(.*)$ /$1 break;
        proxy_pass http://brunost_judge;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
    }

    location = /readyz { proxy_pass http://brunost_premium; }
    location /api/ {
        limit_req zone=brunost_api burst=240 nodelay;
        proxy_pass http://brunost_premium;
    }
    location = /healthz { proxy_pass http://brunost_premium; }
    location / { proxy_pass http://brunost_premium; }
}
