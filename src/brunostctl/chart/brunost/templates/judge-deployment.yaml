apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "brunost.fullname" . }}-judge
  labels:
    {{- include "brunost.labels" . | nindent 4 }}
    app.kubernetes.io/component: judge
spec:
  replicas: {{ .Values.judge.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: judge
      {{- include "brunost.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: judge
        {{- include "brunost.labels" . | nindent 8 }}
    spec:
      containers:
        - name: judge
          image: {{ .Values.judge.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["server", "--host", "0.0.0.0", "--port", "8787"]
          ports:
            - name: http
              containerPort: {{ .Values.judge.port }}
          env:
            - name: BRUNOST_JUDGE_DATABASE_URL
              value: {{ if .Values.postgres.externalUrl }}{{ .Values.postgres.externalUrl | quote }}{{ else }}postgresql://brunost:$(POSTGRES_PASSWORD)@{{ include "brunost.fullname" . }}-postgres:5432/brunost{{ end }}
            {{- if not .Values.postgres.externalUrl }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "brunost.fullname" . }}-postgres
                  key: password
            {{- end }}
            - name: BRUNOST_JUDGE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "brunost.fullname" . }}-judge
                  key: api-token
            - name: BRUNOST_JUDGE_CALLBACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "brunost.fullname" . }}-judge
                  key: callback-secret
            - name: BRUNOST_JUDGE_REQUIRE_API_TOKEN
              value: "true"
            - name: BRUNOST_JUDGE_REQUIRE_WORKER_TOKEN
              value: "true"
            - name: BRUNOST_JUDGE_ENV
              value: production
            - name: BRUNOST_JUDGE_REQUIRE_IMMUTABLE_ARTIFACTS
              value: "true"
            - name: BRUNOST_JUDGE_REQUIRE_SIGNED_CALLBACKS
              value: "true"
            - name: BRUNOST_JUDGE_CLUSTER_ID
              value: {{ .Release.Name | quote }}
            - name: BRUNOST_JUDGE_ARTIFACT_BACKEND
              value: {{ .Values.artifacts.backend | quote }}
            - name: BRUNOST_JUDGE_ARTIFACT_ENDPOINT
              value: {{ .Values.artifacts.endpoint | quote }}
            - name: BRUNOST_JUDGE_ARTIFACT_BUCKET
              value: {{ .Values.artifacts.bucket | quote }}
            - name: BRUNOST_JUDGE_ARTIFACT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "brunost.fullname" . }}-judge
                  key: artifact-access-key
            - name: BRUNOST_JUDGE_ARTIFACT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "brunost.fullname" . }}-judge
                  key: artifact-secret-key
            - name: BRUNOST_JUDGE_CALLBACK_HOSTS
              value: {{ join "," .Values.judge.callbackHosts | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
