apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "brunost.fullname" . }}-callback-dispatcher
  labels:
    {{- include "brunost.labels" . | nindent 4 }}
    app.kubernetes.io/component: callback-dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: callback-dispatcher
      {{- include "brunost.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: callback-dispatcher
        {{- include "brunost.labels" . | nindent 8 }}
    spec:
      containers:
        - name: callback-dispatcher
          image: {{ .Values.judge.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["callback-dispatcher", "--poll-seconds", "1"]
          env:
            - name: BRUNOST_JUDGE_DATABASE_URL
              value: {{ if .Values.postgres.externalUrl }}{{ .Values.postgres.externalUrl | quote }}{{ else }}postgresql://brunost:$(POSTGRES_PASSWORD)@{{ include "brunost.fullname" . }}-postgres:5432/brunost{{ end }}
            {{- if not .Values.postgres.externalUrl }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "brunost.fullname" . }}-postgres
                  key: password
            {{- end }}
            - name: BRUNOST_JUDGE_CALLBACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "brunost.fullname" . }}-judge
                  key: callback-secret
            - name: BRUNOST_JUDGE_REQUIRE_SIGNED_CALLBACKS
              value: "true"
            - name: BRUNOST_JUDGE_ENV
              value: production
